<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bike Details | Velocity Motors Pakistan</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: '#0A0A0A',
            secondary: '#1A1A1A',
            accent: '#E10600',
          }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap');
    body { font-family: 'Inter', sans-serif; }
    .btn-primary { background: #E10600; }
    .btn-primary:hover { background: #c00500; }
    .glass { background: rgba(26,26,26,0.85); backdrop-filter: blur(12px); }
    .whatsapp-btn {
      position: fixed; bottom: 24px; right: 24px; z-index: 50;
      background: #25D366; width: 60px; height: 60px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 4px 20px rgba(37,211,102,0.4);
    }
    .color-dot { width: 28px; height: 28px; border-radius: 50%; border: 2px solid transparent; cursor: pointer; }
    .color-dot.active { border-color: white; transform: scale(1.15); }
  </style>
</head>
<body class="bg-primary text-white">

  <!-- Navbar -->
  <nav class="fixed top-0 left-0 right-0 z-40 glass border-b border-gray-800">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex items-center justify-between h-16 md:h-20">
        <a href="index.html" class="flex items-center gap-2">
          <div class="w-10 h-10 bg-accent rounded-full flex items-center justify-center font-black text-xl">V</div>
          <div>
            <span class="font-bold text-xl">Velocity</span><span class="text-accent font-bold text-xl">Motors</span>
          </div>
        </a>
        <div class="hidden md:flex items-center gap-8">
          <a href="index.html" class="text-sm font-medium hover:text-accent transition">Home</a>
          <a href="bikes.html" class="text-sm font-medium hover:text-accent transition">Bikes</a>
          <a href="about.html" class="text-sm font-medium hover:text-accent transition">About</a>
          <a href="book.html" class="text-sm font-medium hover:text-accent transition">Test Ride</a>
          <a href="contact.html" class="text-sm font-medium hover:text-accent transition">Contact</a>
          <a href="book.html" class="btn-primary px-5 py-2.5 rounded-full text-sm font-semibold">Book Test Ride</a>
        </div>
        <button id="mobile-menu-btn" class="md:hidden text-2xl"><i class="fas fa-bars"></i></button>
      </div>
    </div>
    <div id="mobile-menu" class="hidden md:hidden bg-secondary border-t border-gray-800">
      <div class="px-4 py-4 space-y-3">
        <a href="index.html" class="block py-2 hover:text-accent">Home</a>
        <a href="bikes.html" class="block py-2 hover:text-accent">Bikes</a>
        <a href="about.html" class="block py-2 hover:text-accent">About</a>
        <a href="book.html" class="block py-2 hover:text-accent">Test Ride</a>
        <a href="contact.html" class="block py-2 hover:text-accent">Contact</a>
      </div>
    </div>
  </nav>

  <div id="bike-content" class="pt-24 pb-16">
    <!-- Content injected by JS -->
  </div>

  <!-- Related Bikes -->
  <section class="py-16 bg-secondary">
    <div class="max-w-7xl mx-auto px-4">
      <h2 class="text-2xl md:text-3xl font-bold mb-8">Related Bikes</h2>
      <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6" id="related-bikes"></div>
    </div>
  </section>

  <footer class="bg-primary border-t border-gray-800 py-8">
    <div class="max-w-7xl mx-auto px-4 text-center text-gray-500 text-sm">
      © 2026 Velocity Motors Pakistan. All rights reserved.
    </div>
  </footer>

  <a href="https://wa.me/923001234567" target="_blank" class="whatsapp-btn">
    <i class="fab fa-whatsapp text-white text-3xl"></i>
  </a>

  <script src="js/bikes-data.js"></script>
  <script src="js/main.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const id = parseInt(getQueryParam('id')) || 1;
      const bike = bikesData.find(b => b.id === id) || bikesData[0];

      document.title = `${bike.name} | Velocity Motors Pakistan`;

      // Main content
      document.getElementById('bike-content').innerHTML = `
        <div class="max-w-7xl mx-auto px-4">
          <div class="mb-6">
            <a href="bikes.html" class="text-gray-400 hover:text-accent text-sm"><i class="fas fa-arrow-left mr-2"></i>Back to Bikes</a>
          </div>

          <div class="grid grid-cols-1 lg:grid-cols-2 gap-10 lg:gap-16">
            <!-- Image -->
            <div>
              <div class="bg-secondary rounded-2xl overflow-hidden border border-gray-800">
                <img src="${bike.image}" alt="${bike.name}" class="w-full h-80 md:h-96 object-cover">
              </div>
              <div class="flex gap-3 mt-4">
                ${bike.colors.map((c, i) => {
                  const colorMap = {Red:'#E10600', Black:'#111', Blue:'#1e40af', Silver:'#c0c0c0', White:'#f5f5f5'};
                  return `<div class="color-dot ${i===0?'active':''}" style="background:${colorMap[c]||'#666'}" title="${c}"></div>`;
                }).join('')}
              </div>
            </div>

            <!-- Info -->
            <div>
              <p class="text-accent font-semibold tracking-wider uppercase text-sm mb-2">${bike.brand}</p>
              <h1 class="text-3xl md:text-4xl font-black mb-3">${bike.name}</h1>
              <p class="text-gray-400 mb-6">${bike.description}</p>

              <div class="text-3xl font-black text-accent mb-8">Rs. ${bike.price.toLocaleString()}</div>

              <!-- Key Specs -->
              <div class="grid grid-cols-2 gap-4 mb-8">
                <div class="bg-secondary border border-gray-800 rounded-xl p-4">
                  <p class="text-gray-500 text-xs mb-1">Engine</p>
                  <p class="font-bold">${bike.engine}</p>
                </div>
                <div class="bg-secondary border border-gray-800 rounded-xl p-4">
                  <p class="text-gray-500 text-xs mb-1">Mileage</p>
                  <p class="font-bold">${bike.mileage}</p>
                </div>
                <div class="bg-secondary border border-gray-800 rounded-xl p-4">
                  <p class="text-gray-500 text-xs mb-1">Transmission</p>
                  <p class="font-bold">${bike.transmission}</p>
                </div>
                <div class="bg-secondary border border-gray-800 rounded-xl p-4">
                  <p class="text-gray-500 text-xs mb-1">Start</p>
                  <p class="font-bold">${bike.start}</p>
                </div>
              </div>

              <div class="flex flex-wrap gap-4 mb-10">
                <a href="book.html?bike=${encodeURIComponent(bike.name)}" class="btn-primary px-8 py-3.5 rounded-full font-bold flex items-center gap-2">
                  <i class="fas fa-motorcycle"></i> Book Test Ride
                </a>
                <a href="https://wa.me/923001234567?text=Hi, I'm interested in ${encodeURIComponent(bike.name)}" target="_blank" 
                   class="border border-gray-600 px-8 py-3.5 rounded-full font-bold hover:border-accent hover:text-accent transition flex items-center gap-2">
                  <i class="fab fa-whatsapp"></i> Enquire Now
                </a>
              </div>

              <!-- EMI Calculator -->
              <div class="bg-secondary border border-gray-800 rounded-2xl p-6">
                <h3 class="font-bold text-lg mb-4"><i class="fas fa-calculator text-accent mr-2"></i>EMI Calculator</h3>
                <div class="space-y-4">
                  <div>
                    <label class="text-sm text-gray-400">Down Payment (Rs.)</label>
                    <input type="number" id="down-payment" value="${Math.round(bike.price * 0.3)}" 
                           class="w-full mt-1 bg-primary border border-gray-700 rounded-lg px-4 py-2.5 focus:outline-none focus:border-accent">
                  </div>
                  <div>
                    <label class="text-sm text-gray-400">Tenure (Months)</label>
                    <select id="tenure" class="w-full mt-1 bg-primary border border-gray-700 rounded-lg px-4 py-2.5 focus:outline-none focus:border-accent">
                      <option value="12">12 Months</option>
                      <option value="18">18 Months</option>
                      <option value="24" selected>24 Months</option>
                      <option value="36">36 Months</option>
                    </select>
                  </div>
                  <div class="pt-2 border-t border-gray-700">
                    <p class="text-gray-400 text-sm">Estimated Monthly EMI</p>
                    <p class="text-2xl font-black text-accent" id="emi-result">Calculating...</p>
                    <p class="text-xs text-gray-500 mt-1">*Approx. @ 1.5% per month. Actual rates may vary.</p>
                  </div>
                </div>
              </div>
            </div>
          </div>

          <!-- Full Specs -->
          <div class="mt-16">
            <h2 class="text-2xl font-bold mb-6">Full Specifications</h2>
            <div class="bg-secondary border border-gray-800 rounded-2xl overflow-hidden">
              <table class="w-full text-left">
                <tbody>
                  ${Object.entries(bike.specs).map(([key, val], i) => `
                    <tr class="${i % 2 === 0 ? 'bg-primary/50' : ''}">
                      <td class="px-6 py-3.5 text-gray-400 font-medium w-1/3">${key}</td>
                      <td class="px-6 py-3.5 font-semibold">${val}</td>
                    </tr>
                  `).join('')}
                </tbody>
              </table>
            </div>
          </div>
        </div>
      `;

      // EMI calculation
      function calcEMI() {
        const price = bike.price;
        const down = parseInt(document.getElementById('down-payment').value) || 0;
        const months = parseInt(document.getElementById('tenure').value);
        const principal = price - down;
        const monthlyRate = 0.015; // 1.5% approx
        const emi = principal * monthlyRate * Math.pow(1 + monthlyRate, months) / (Math.pow(1 + monthlyRate, months) - 1);
        document.getElementById('emi-result').textContent = 'Rs. ' + Math.round(emi).toLocaleString();
      }

      document.getElementById('down-payment').addEventListener('input', calcEMI);
      document.getElementById('tenure').addEventListener('change', calcEMI);
      calcEMI();

      // Related bikes
      const related = bikesData.filter(b => b.category === bike.category && b.id !== bike.id).slice(0, 4);
      document.getElementById('related-bikes').innerHTML = related.map(b => `
        <a href="bike-detail.html?id=${b.id}" class="bg-primary border border-gray-800 rounded-2xl overflow-hidden hover:border-accent transition block">
          <img src="${b.image}" alt="${b.name}" class="w-full h-40 object-cover">
          <div class="p-4">
            <p class="text-xs text-gray-400">${b.brand}</p>
            <h3 class="font-bold">${b.name}</h3>
            <p class="text-accent font-semibold mt-1">Rs. ${b.price.toLocaleString()}</p>
          </div>
        </a>
      `).join('');
    });
  </script>
</body>
</html>
